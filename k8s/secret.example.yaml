apiVersion: v1
kind: Secret
metadata:
  name: url-shortener-secret
  namespace: url-shortener
type: Opaque
stringData:
  DATABASE_URL: postgresql://urlshortener:CHANGE_ME@postgres:5432/urlshortener
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: url-shortener
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
